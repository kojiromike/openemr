name: Database Changes

on:
  push:
    branches:
    - master
    - rel-*
    paths:
    - 'sql/database.sql'
    - 'sql/*_upgrade.sql'
    - 'version.php'
    - '.github/workflows/database-changes.yml'
  pull_request:
    branches:
    - master
    - rel-*
    paths:
    - 'sql/database.sql'
    - 'sql/*_upgrade.sql'
    - 'version.php'
    - '.github/workflows/database-changes.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-database-changes:
    name: Validate Database Changes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          json: true
          files: |
            sql/database.sql
            sql/*_upgrade.sql
            version.php

      - name: Detect migration file changes
        id: detect-migrations
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # Only need jq for regex matching - exact matches use GitHub's contains()
          MIGRATION_CHANGED=$(jq 'any(test("^sql/.*_upgrade\\.sql$"))' <<< "$CHANGED_FILES")
          MIGRATION_FILES=$(jq -c '[.[] | select(test("^sql/.*_upgrade\\.sql$"))]' <<< "$CHANGED_FILES")

          {
            echo "migration_changed=$MIGRATION_CHANGED"
            echo "migration_files=$MIGRATION_FILES"
          } >> "$GITHUB_OUTPUT"

          echo "Migration changed: $MIGRATION_CHANGED"
          echo "Migration files: $MIGRATION_FILES"

      - name: Check for trivial database.sql changes
        id: trivial-check
        if: contains(fromJSON(steps.changed-files.outputs.all_changed_files), 'sql/database.sql')
        run: |
          if [[ '${{ github.event_name }}' = pull_request ]]; then
            BASE_REF='${{ github.event.pull_request.base.sha }}'
          else
            BASE_REF='${{ github.event.before }}'
          fi

          echo "Comparing against base: $BASE_REF"

          # Check for whitespace-only changes
          WHITESPACE_DIFF=$(git diff --ignore-all-space --ignore-blank-lines "$BASE_REF" -- sql/database.sql || true)

          if [[ -z $WHITESPACE_DIFF ]]; then
            {
              echo 'trivial=true'
              echo 'reason=whitespace-only'
            } >> "$GITHUB_OUTPUT"
            echo 'Changes are whitespace-only'
            exit 0
          fi

          # Check for comment-only changes
          # Get added/removed lines, strip SQL comments (-- style), check if anything remains
          CONTENT_DIFF=$(
            git diff "$BASE_REF" -- sql/database.sql |
            grep -E '^[+-]' |
            grep -v '^[+-]{3}' |
            sed -e 's/^[+-]//' \
                -e 's/--.*$//' \
                -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' |
            grep -v '^$' ||
            true
          )

          if [[ -z $CONTENT_DIFF ]]; then
            {
              echo 'trivial=true'
              echo 'reason=comment-only'
            } >> "$GITHUB_OUTPUT"
            echo 'Changes are comment-only'
            exit 0
          fi

          {
            echo 'trivial=false'
            echo 'reason=substantial'
          } >> "$GITHUB_OUTPUT"
          echo 'Changes are substantial'

      - name: Extract version database values
        id: version-check
        run: |
          # Get current v_database value
          CURRENT_VERSION=$(grep -oP '\$v_database\s*=\s*\K[0-9]+' version.php)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current \$v_database: $CURRENT_VERSION"

          # Get base v_database value
          if [[ '${{ github.event_name }}' = pull_request ]]; then
            BASE_REF='${{ github.event.pull_request.base.sha }}'
          else
            BASE_REF='${{ github.event.before }}'
          fi

          BASE_VERSION=$(git show "$BASE_REF:version.php" 2>/dev/null | grep -oP '\$v_database\s*=\s*\K[0-9]+' || echo "$CURRENT_VERSION")
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Base \$v_database: $BASE_VERSION"

          if [[ $CURRENT_VERSION != $BASE_VERSION ]]; then
            echo 'version_bumped=true' >> "$GITHUB_OUTPUT"
            echo "Version was bumped: $BASE_VERSION -> $CURRENT_VERSION"
          else
            echo 'version_bumped=false' >> "$GITHUB_OUTPUT"
            echo 'Version was not bumped'
          fi

      - name: Validate database change consistency
        id: validate
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          MIGRATION_CHANGED: ${{ steps.detect-migrations.outputs.migration_changed }}
          VERSION_BUMPED: ${{ steps.version-check.outputs.version_bumped }}
          TRIVIAL: ${{ steps.trivial-check.outputs.trivial }}
          TRIVIAL_REASON: ${{ steps.trivial-check.outputs.reason }}
          CURRENT_VERSION: ${{ steps.version-check.outputs.current_version }}
        run: |
          DATABASE_CHANGED=$(jq 'any(. == "sql/database.sql")' <<< "$CHANGED_FILES")

          declare -a ERRORS=()

          # Skip validation for trivial changes
          if [[ $DATABASE_CHANGED = true && $TRIVIAL = true ]]; then
            echo "::notice::Skipping validation - database.sql changes are trivial ($TRIVIAL_REASON)"
            {
              echo 'validation_skipped=true'
              echo "skip_reason=$TRIVIAL_REASON"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'validation_skipped=false' >> "$GITHUB_OUTPUT"

          if [[ $DATABASE_CHANGED = true ]]; then

            # Rule 1: database.sql changed without $v_database bump
            if [[ $VERSION_BUMPED != true ]]; then
              printf -v err '%s\n%s\n%s' \
                '- **database.sql changed without \$v_database bump**' \
                '  - You modified `sql/database.sql` but did not increment `\$v_database` in `version.php`' \
                "  - Fix: Increment the value of \`\\\$v_database\` in \`version.php\` (current: ${CURRENT_VERSION})"
              ERRORS+=("$err")
            fi

            # Rule 2: database.sql changed without migration file change
            if [[ $MIGRATION_CHANGED != true ]]; then
              printf -v err '%s\n%s\n%s' \
                '- **database.sql changed without migration file**' \
                '  - You modified `sql/database.sql` but did not add/update a migration file' \
                '  - Fix: Add your schema changes to the appropriate `sql/*_upgrade.sql` migration file'
              ERRORS+=("$err")
            fi

          else

            # Rule 3: Migration file changed without database.sql change
            if [[ $MIGRATION_CHANGED = true ]]; then
              printf -v err '%s\n%s\n%s' \
                '- **Migration file changed without database.sql change**' \
                '  - You modified a migration file but did not update `sql/database.sql`' \
                '  - Fix: Ensure `sql/database.sql` reflects the final schema state after your migration'
              ERRORS+=("$err")
            fi

            # Rule 4: $v_database changed without database.sql change
            if [[ $VERSION_BUMPED = true ]]; then
              printf -v err '%s\n%s\n%s' \
                '- **\$v_database changed without database.sql change**' \
                '  - You incremented `\$v_database` but did not modify `sql/database.sql`' \
                '  - Fix: If there are no schema changes, revert the \$v_database change'
              ERRORS+=("$err")
            fi
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            {
              echo 'has_errors=true'
              echo 'errors<<EOF'
              printf '%s\n' "${ERRORS[@]}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo 'Validation failed with errors'
          else
            echo 'has_errors=false' >> "$GITHUB_OUTPUT"
            echo 'All database change consistency checks passed!'
          fi

      - name: Add label to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'Database Changes';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [labelName]
              });
              console.log(`Added label "${labelName}" to PR #${context.issue.number}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Label "${labelName}" does not exist, leaving comment instead`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `> **Note**: This PR contains database changes but the "${labelName}" label does not exist in this repository. Please create this label for better PR categorization.`
                });
              } else {
                throw error;
              }
            }

      - name: Report validation errors
        if: steps.validate.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ steps.validate.outputs.errors }}`;

            const body = `## Database Change Validation Failed

            This PR has database-related changes that are inconsistent. Please address the following issues:
            ${errors}

            ### How Database Changes Work in OpenEMR

            When making database schema changes, you must update all three files together:
            1. **\`sql/database.sql\`** - Update with the final schema state (for fresh installs)
            2. **\`sql/*_upgrade.sql\`** - Add migration SQL to the appropriate upgrade file (for existing installs)
            3. **\`version.php\`** - Increment \`$v_database\` value

            All three files must be updated together for any schema change.`;

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            core.setFailed('Database change validation failed. See PR comment for details.');

      - name: Report trivial changes skipped
        if: steps.validate.outputs.validation_skipped == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = '${{ steps.trivial-check.outputs.reason }}';
            console.log(`Validation skipped: ${reason} changes only`);
