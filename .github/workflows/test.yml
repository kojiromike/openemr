##
# Main test workflow that runs tests directly on GitHub Actions runner
# without Docker Compose overhead. This workflow handles:
# - Unit tests
# - Fixtures tests
# - Services tests
# - Validators tests
# - Controllers tests
# - Common tests
#
# E2E, Email, and API tests run in test-e2e.yml due to their need for
# full webserver and Selenium infrastructure.

name: Test

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} - ${{ matrix.database.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
        - '8.2'
        - '8.3'
        - '8.4'
        - '8.5'
        database:
        - name: 'MySQL 8.0'
          image: 'mysql:8.0'
          type: 'mysql'
        - name: 'MariaDB 11.4'
          image: 'mariadb:11.4'
          type: 'mariadb'

    env:
      ENABLE_COVERAGE: true
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: openemr
      DB_USERNAME: openemr
      DB_PASSWORD: openemr
      DB_ROOT_PASSWORD: root

    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openemr
          MYSQL_USER: openemr
          MYSQL_PASSWORD: openemr
        ports:
          - 3306:3306
        options: >-
          '--health-cmd=/usr/local/bin/healthcheck.sh --su-mysql --connect --innodb_initialized'
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mysqli, pdo, pdo_mysql, gd, curl, zip, intl, soap, xmlrpc, mbstring, openssl, fileinfo, simplexml, xml, dom, filter, session, json
        coverage: ${{ env.ENABLE_COVERAGE == 'true' && 'xdebug' || 'none' }}
        ini-values: memory_limit=2G

    - name: Report PHP Version
      run: php -v

    - name: Get composer cache directory
      id: composer-cache
      run: |
        {
          printf 'dir='
          composer config cache-files-dir
        } >> $GITHUB_OUTPUT

    - name: Composer Cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ matrix.php }}-
          ${{ runner.os }}-composer-

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Get NPM Cache Directory
      id: npm-cache-dir
      run: |
        {
          printf 'dir='
          npm config get cache
        } >> "$GITHUB_OUTPUT"

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-22-
          ${{ runner.os }}-node-

    - name: Install Composer dependencies
      run: |
        composer install --prefer-dist --no-progress

    - name: Install and build npm packages
      run: |
        npm ci
        npm run build

    - name: CCDA build
      run: |
        cd ccdaservice
        npm ci

    - name: Prepare OpenEMR directories
      run: |
        mkdir -p sites/default/documents
        chmod 777 sites/default/documents
        chmod 666 sites/default/sqlconf.php

    - name: Wait for database to be ready
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h"$DB_HOST" -uroot -p"$DB_ROOT_PASSWORD" --silent; then
            echo "Database is ready"
            exit 0
          fi
          echo "Waiting for database... ($i/30)"
          sleep 2
        done
        echo "Database failed to become ready"
        exit 1

    - name: Install and configure OpenEMR
      env:
        OPENEMR_ENABLE_INSTALLER_AUTO: '1'
      run: |
        # Run OpenEMR installer
        php -f ./contrib/util/installScripts/InstallerAuto.php \
          rootpass=root \
          server="$DB_HOST" \
          port="$DB_PORT" \
          loginhost=% \
          dbname="$DB_DATABASE" \
          collate=utf8mb4_general_ci

    - name: Configure OpenEMR for testing
      run: |
        mysql -h"$DB_HOST" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<EOF
        INSERT INTO product_registration (opt_out) VALUES (1);
        UPDATE globals SET gl_value = 1 WHERE gl_name = 'rest_api';
        UPDATE globals SET gl_value = 1 WHERE gl_name = 'rest_fhir_api';
        UPDATE globals SET gl_value = 1 WHERE gl_name = 'rest_portal_api';
        UPDATE globals SET gl_value = 3 WHERE gl_name = 'oauth_password_grant';
        UPDATE globals SET gl_value = 1 WHERE gl_name = 'rest_system_scopes_api';
        EOF

    - name: Unit testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-unit.xml \
          --testsuite unit \
          --testdox

    - name: Upload unit test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-unit.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-unit.xml
        flags: unit,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Fixtures testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-fixtures.xml \
          --testsuite fixtures \
          --testdox

    - name: Upload fixtures test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-fixtures.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-fixtures.xml
        flags: fixtures,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Services testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-services.xml \
          --testsuite services \
          --testdox

    - name: Upload services test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-services.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-services.xml
        flags: services,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Validators testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-validators.xml \
          --testsuite validators \
          --testdox

    - name: Upload validators test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-validators.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-validators.xml
        flags: validators,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Controllers testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-controllers.xml \
          --testsuite controllers \
          --testdox

    - name: Upload controllers test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-controllers.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-controllers.xml
        flags: controllers,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Common testing
      if: ${{ success() || failure() }}
      run: |
        php -d memory_limit=8G ./vendor/bin/phpunit \
          --log-junit junit-common.xml \
          --testsuite common \
          --testdox

    - name: Upload common test results to Codecov
      if: ${{ !cancelled() && hashFiles('junit-common.xml') != '' }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-common.xml
        flags: common,php${{ matrix.php }},${{ matrix.database.type }}

    - name: Upload JUnit test results to GitHub
      if: ${{ !cancelled() && hashFiles('junit-*.xml') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: junit-test-results-simple-php${{ matrix.php }}-${{ matrix.database.type }}
        path: junit-*.xml
