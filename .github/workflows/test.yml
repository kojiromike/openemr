name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Collect Docker Dirs
      id: docker-dirs
      shell: bash
      ##
      # Parse out the test parameters from the ci subdirectories that contain
      # docker-compose.yml files. We'll use that output as a test matrix
      # in github actions.
      run: |
        shopt -s nullglob
        dirs=( ci/*/docker-compose.yml )
        if (( "${#dirs[@]}" == 0 )); then
          echo 'No docker-compose.yml files found in ci subdirectories.' >&2
          exit 1
        fi
        node_version=22
        # Avoid trying to save the cache in duplicate for every matrix element.
        declare -A seen_composer_cache_keys
        declare -A seen_npm_cache_keys
        dirs=( "${dirs[@]%/docker-compose.yml}" )
        dirs=( "${dirs[@]#ci/}" )
        # Everything inside this for loop that goes to stdout ends up
        # in the github output, so it must be valid json.
        for docker_dir in "${dirs[@]}"; do
            IFS=: read -r database db < <(yq '.services.mysql.image' "ci/${docker_dir}/docker-compose.yml")
            IFS=_ read -r webserver php _ <<< "${docker_dir}"

            # collect docker-compose.yml templates that will be used in the docker compose up merge
            selenium_template=$(yq '.x-includes.selenium-template' "ci/${docker_dir}/docker-compose.yml")
            webserver_template=$(yq '.x-includes.webserver-template' "ci/${docker_dir}/docker-compose.yml")
            database_template=$(yq '.x-includes.database-template' "ci/${docker_dir}/docker-compose.yml")

            # If docker_dir ends with "_no-e2e", we want to skip the e2e tests for this configuration.
            [[ $docker_dir = *_no-e2e ]] && e2e_enabled=false || e2e_enabled=true

            printf -v php '%d.%d' "${php::1}" "${php:1}"
            if [[ -z ${seen_composer_cache_keys[$php]} ]]; then
                seen_composer_cache_keys[$php]=true
                save_composer_cache=true
            else
                save_composer_cache=false
            fi
            if [[ -z ${seen_npm_cache_keys[$node_version]} ]]; then
                seen_npm_cache_keys[$node_version]=true
                save_node_cache=true
            else
                save_node_cache=false
            fi

            case "$webserver" in
                apache)
                    openemr_dir=/var/www/localhost/htdocs/openemr
                    ;;
                nginx)
                    openemr_dir=/usr/share/nginx/html/openemr
                    ;;
                *)
                    echo "Unknown webserver: $webserver" >&2;
                    exit 1
                    ;;
            esac
            # Determine if this job should save caches (only first job with each version)
            [[ $docker_dir = apache_84_114 ]] && save_cache=true || save_cache="false"

            printf '{
                "database": "%s",
                "database_template": "%s",
                "db": "%s",
                "docker_dir": "%s",
                "e2e_enabled": "%s",
                "node_version": "%s",
                "openemr_dir": "%s",
                "php": "%s",
                "save_composer_cache": "%s",
                "save_node_cache": "%s",
                "selenium_template": "%s",
                "webserver": "%s",
                "webserver_template": "%s"
            }\n' "$database" \
                 "$database_template" \
                 "$db" \
                 "$docker_dir" \
                 "$e2e_enabled" \
                 "$node_version" \
                 "$openemr_dir" \
                 "$php" \
                 "$save_composer_cache" \
                 "$save_node_cache" \
                 "$selenium_template" \
                 "$webserver" \
                 "$webserver_template"
        done | {
            printf 'configurations='
            jq -cs .
        } >> "$GITHUB_OUTPUT"
    outputs:
      configurations: ${{ steps.docker-dirs.outputs.configurations }}

  initialize:
    name: Initialize - PHP ${{ matrix.configurations.php }} - ${{ matrix.configurations.webserver }} - ${{ matrix.configurations.database }} ${{ matrix.configurations.db }}
    runs-on: ubuntu-24.04
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        configurations: ${{ fromJson(needs.collect.outputs.configurations) }}
    env:
      DOCKER_DIR: ${{ matrix.configurations.docker_dir }}
      ENABLE_COVERAGE: ${{ matrix.configurations.docker_dir == 'apache_84_114' && 'true' || 'false' }}
      OPENEMR_DIR: ${{ matrix.configurations.openemr_dir }}
      COMPOSE_FILE: "ci/${{ matrix.configurations.selenium_template }}:ci/${{ matrix.configurations.webserver_template }}:ci/${{ matrix.configurations.database_template }}:ci/${{ matrix.configurations.docker_dir }}/docker-compose.yml"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.configurations.php }}
    - name: Report PHP Version
      run: php -v
    - name: Get composer cache directory
      id: composer-cache
      run: |
        {
          printf 'dir='
          composer config cache-files-dir
        } >> $GITHUB_OUTPUT
    - name: Composer Cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ matrix.configurations.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ matrix.configurations.php }}-
          ${{ runner.os }}-composer-
    - name: Install npm package
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.configurations.node_version }}
    - name: Get NPM Cache Directory
      id: npm-cache-dir
      run: |
        {
          printf 'dir='
          npm config get cache
        } >> "$GITHUB_OUTPUT"
    - name: Cache node modules
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-${{ matrix.configurations.node_version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.configurations.node_version }}-
          ${{ runner.os }}-node-
    - name: Main build
      shell: bash
      run: |
        . ci/ciLibrary.source
        composer_github_auth
        main_build
    - name: CCDA build
      shell: bash
      run: |
        . ci/ciLibrary.source
        ccda_build
    - name: Save node cache
      if: ${{ matrix.configurations.save_node_cache == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-${{ matrix.configurations.node_version }}-${{ hashFiles('**/package-lock.json') }}
    - name: Save composer cache
      if: ${{ matrix.configurations.save_composer_cache == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ matrix.configurations.php }}-${{ hashFiles('**/composer.lock') }}
    - name: Docker Compose Config Output
      shell: bash
      run: |
        . ci/ciLibrary.source
        dc config
    - name: Dockers environment start
      shell: bash
      run: |
        . ci/ciLibrary.source
        dockers_env_start
    - name: Wait for MySQL to initialize
      if: ${{ matrix.configurations.database == 'mysql' }}
      run: sleep 30
    - name: Install and configure
      run: |
        . ci/ciLibrary.source
        install_configure
    - name: Prepare for coverage reporting
      if: ${{ env.ENABLE_COVERAGE == 'true' }}
      run: |
        . ci/ciLibrary.source
        configure_coverage
    - name: Save running container state
      shell: bash
      run: docker compose ps --format json > docker-state.json
    - name: Save Docker image list
      shell: bash
      run: |
        docker compose images --format json | jq -r '.[] | select(.Repository != "<none>") | .Repository + ":" + .Tag' | sort -u > image-list.txt
    - name: Validate image list
      if: hashFiles('image-list.txt') == ''
      run: |
        echo 'Error: No Docker images found. This indicates a problem with the Docker environment setup.'
        exit 1
    - name: Save Docker images
      run: |
        docker save $(cat image-list.txt) | gzip > docker-images.tar.gz
    - name: Create workspace archive excluding large directories
      run: |
        tar -czf ../workspace.tar.gz \
          --exclude=node_modules \
          --exclude=vendor/*/test* \
          --exclude=vendor/*/Test* \
          --exclude=.git \
          --exclude=docker-images.tar.gz \
          .
        mv ../workspace.tar.gz .
    - name: Upload initialized environment
      uses: actions/upload-artifact@v4
      with:
        name: test-env-${{ matrix.configurations.docker_dir }}
        path: |
          docker-state.json
          docker-images.tar.gz
          image-list.txt
          workspace.tar.gz
        retention-days: 1

  unit-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: unit
      configurations: ${{ needs.collect.outputs.configurations }}

  e2e-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: e2e
      configurations: ${{ needs.collect.outputs.configurations }}
      compose-profiles: video-recording

  api-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: api
      configurations: ${{ needs.collect.outputs.configurations }}

  fixtures-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: fixtures
      configurations: ${{ needs.collect.outputs.configurations }}

  services-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: services
      configurations: ${{ needs.collect.outputs.configurations }}

  validators-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: validators
      configurations: ${{ needs.collect.outputs.configurations }}

  controllers-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: controllers
      configurations: ${{ needs.collect.outputs.configurations }}

  common-tests:
    needs: [collect, initialize]
    uses: ./.github/workflows/run-tests.yml
    with:
      test-suite: common
      configurations: ${{ needs.collect.outputs.configurations }}

  combine-coverage:
    name: Combine Coverage - PHP ${{ matrix.configurations.php }} - ${{ matrix.configurations.webserver }} - ${{ matrix.configurations.database }} ${{ matrix.configurations.db }}
    runs-on: ubuntu-24.04
    needs: [collect, initialize, unit-tests, e2e-tests, api-tests, fixtures-tests, services-tests, validators-tests, controllers-tests, common-tests]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        configurations: ${{ fromJson(needs.collect.outputs.configurations) }}
    env:
      DOCKER_DIR: ${{ matrix.configurations.docker_dir }}
      ENABLE_COVERAGE: ${{ matrix.configurations.docker_dir == 'apache_84_114' && 'true' || 'false' }}
      OPENEMR_DIR: ${{ matrix.configurations.openemr_dir }}
      COMPOSE_FILE: "ci/${{ matrix.configurations.selenium_template }}:ci/${{ matrix.configurations.webserver_template }}:ci/${{ matrix.configurations.database_template }}:ci/${{ matrix.configurations.docker_dir }}/docker-compose.yml"
    steps:
    - name: Download initialized environment
      if: ${{ env.ENABLE_COVERAGE == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: test-env-${{ matrix.configurations.docker_dir }}
    - name: Download all coverage artifacts
      if: ${{ env.ENABLE_COVERAGE == 'true' }}
      uses: actions/download-artifact@v4
      with:
        pattern: '*-coverage-${{ matrix.configurations.docker_dir }}'
        merge-multiple: true
    - name: Restore workspace and combine coverage
      if: ${{ env.ENABLE_COVERAGE == 'true' }}
      run: |
        tar -xzf workspace.tar.gz
        . ci/ciLibrary.source
        merge_coverage
    - name: Check if coverage files exist
      if: ${{ env.ENABLE_COVERAGE == 'true' }}
      id: check-files
      run: |
        echo "clover_exists=$(test -f coverage.clover.xml && echo true || echo false)" >> $GITHUB_OUTPUT
        echo "htmlcov_exists=$(test -d ./htmlcov && echo true || echo false)" >> $GITHUB_OUTPUT
    - name: Upload combined coverage
      if: ${{ env.ENABLE_COVERAGE == 'true' && steps.check-files.outputs.clover_exists == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage.clover.xml
        path: coverage.clover.xml
    - name: Upload HTML coverage
      if: ${{ env.ENABLE_COVERAGE == 'true' && steps.check-files.outputs.htmlcov_exists == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: htmlcov
        path: ./htmlcov/
    # - name: Upload coverage reports to Codecov
    #   if: ${{ env.ENABLE_COVERAGE == 'true' && steps.check-files.outputs.clover_exists == 'true' && (success() || failure()) }}
